name: Sync Pterodactyl Egg

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest egg
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/0herculabs/acevo-server/pterodactyl/pterodactyl/egg-assetto-corsa-evo.json \
            -o egg-assetto-corsa-evo.json

      - name: Commit updated egg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add egg-assetto-corsa-evo.json

          if git diff --cached --quiet; then
            echo "Egg is already up to date."
            exit 0
          fi

          git commit -m "Sync latest Pterodactyl egg"
          git push
